AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Lets GitHub Actions in omag-web/omag-hr deploy Pip (the pip-hr stack) without stored AWS keys.
  GitHub proves who it is with a short-lived OpenID Connect token; only the main branch of this
  one repository can use the role. Deploy once:
    aws cloudformation deploy --template-file deploy/github-deploy-role.yaml --stack-name pip-hr-github-deploy --capabilities CAPABILITY_NAMED_IAM

Parameters:
  CreateGitHubOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Set to false if this AWS account already has the token.actions.githubusercontent.com identity provider.
  Repository:
    Type: String
    Default: omag-web/omag-hr
  RepositoryWithIds:
    Type: String
    Default: omag-web@312579818/omag-hr@1455880679
    Description: >-
      The same repository as GitHub names it in newer identity tokens, with the owner and repository
      ID numbers. IDs never change, so a deleted-and-recreated repository with the same name can't
      use this role.
  AppStackName:
    Type: String
    Default: pip-hr

Conditions:
  CreateProvider: !Equals [!Ref CreateGitHubOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pip-hr-github-deploy
      Description: Assumed by GitHub Actions (omag-web/omag-hr, main branch) to deploy Pip.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # GitHub sends one of these, depending on the organization's token format.
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${RepositoryWithIds}:ref:refs/heads/main
                  - !Sub repo:${Repository}:ref:refs/heads/main
      ManagedPolicyArns:
        # Everything SAM needs (CloudFormation, Lambda, S3, DynamoDB, SNS, Cognito, EventBridge,
        # CloudWatch), except IAM...
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: manage-pip-roles-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # ...and IAM only for the roles CloudFormation creates for Pip itself.
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-*

Outputs:
  RoleArn:
    Value: !GetAtt DeployRole.Arn
