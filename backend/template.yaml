AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Pip, OMAG's HR assistant — streaming chat API (Lambda Function URL + Amazon Bedrock + DynamoDB)

Parameters:
  ModelId:
    Type: String
    Default: us.openai.gpt-5.6-terra
    Description: Bedrock inference profile ID. Default is OpenAI GPT-5.6 Terra, US-only routing. Alternatives are us.openai.gpt-5.6-sol (strongest) and us.openai.gpt-5.6-luna (cheapest); Claude profile IDs also work.
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: https://omag-web.github.io,http://localhost:8787
    Description: Web origins allowed to call the API (no trailing slash). Add https://ask.omag.org etc. when you have it.
  ContactEmail:
    Type: String
    Default: ''
    Description: Email that receives "Talk to OMAG" messages (you'll get a confirmation email from AWS). Leave blank to only store them.
  DailyLimitPerIp:
    Type: Number
    Default: 60
    Description: Questions per IP address per day.
  DailyLimitGlobal:
    Type: Number
    Default: 600
    Description: Questions per day across everyone — a hard ceiling on spend.
  RetentionDays:
    Type: Number
    Default: 730
    Description: Days to keep conversation logs before DynamoDB deletes them.
  AdminEmail:
    Type: String
    Default: ''
    Description: First admin for the admin panel. AWS emails this address a temporary password. Add more admins later in the Cognito console.
  LibraryUrl:
    Type: String
    Default: https://omag-web.github.io/omag-hr/backend/data/library.json
    Description: Where the daily refresh downloads the statute library built by the GitHub Action.

Conditions:
  HasContactEmail: !Not [!Equals [!Ref ContactEmail, '']]
  HasAdminEmail: !Not [!Equals [!Ref AdminEmail, '']]

Globals:
  Function:
    Tags:
      app: pip

Resources:
  PipTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - { Key: app, Value: pip }

  # Uploaded OMAG documents and the refreshed statute library. Private.
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !Ref AllowedOrigins
            AllowedMethods: [PUT]
            AllowedHeaders: [content-type]
            MaxAge: 3600
      Tags:
        - { Key: app, Value: pip }

  # Admin sign-in. Only admins create accounts (no public sign-up).
  AdminUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-admins
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailSubject: Your Pip admin account
          EmailMessage: 'You''ve been added as an admin for Pip, OMAG''s HR assistant. Sign in at https://omag-web.github.io/omag-hr/web/admin/ with your email {username} and this temporary password: {####} . You''ll choose your own password the first time you sign in.'
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      UserPoolTags:
        app: pip

  AdminUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref AdminUserPool
      ClientName: pip-admin-web
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      IdTokenValidity: 8
      AccessTokenValidity: 8
      RefreshTokenValidity: 30
      TokenValidityUnits: { IdToken: hours, AccessToken: hours, RefreshToken: days }

  FirstAdmin:
    Type: AWS::Cognito::UserPoolUser
    Condition: HasAdminEmail
    Properties:
      UserPoolId: !Ref AdminUserPool
      Username: !Ref AdminEmail
      DesiredDeliveryMediums: [EMAIL]
      UserAttributes:
        - { Name: email, Value: !Ref AdminEmail }
        - { Name: email_verified, Value: 'true' }

  ContactTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Pip - Talk to OMAG
      Tags:
        - { Key: app, Value: pip }

  ContactSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasContactEmail
    Properties:
      TopicArn: !Ref ContactTopic
      Protocol: email
      Endpoint: !Ref ContactEmail

  PipFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Pip chat API
      CodeUri: ./
      Handler: src/handler.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 1024
      Timeout: 120
      ReservedConcurrentExecutions: 10
      Environment:
        Variables:
          MODEL_ID: !Ref ModelId
          TABLE_NAME: !Ref PipTable
          CONTACT_TOPIC_ARN: !Ref ContactTopic
          DAILY_LIMIT_PER_IP: !Ref DailyLimitPerIp
          DAILY_LIMIT_GLOBAL: !Ref DailyLimitGlobal
          RETENTION_DAYS: !Ref RetentionDays
          HASH_SALT: !Ref AWS::StackId
          DATA_BUCKET: !Ref DataBucket
          USER_POOL_ID: !Ref AdminUserPool
          USER_POOL_CLIENT_ID: !Ref AdminUserPoolClient
          LIBRARY_URL: !Ref LibraryUrl
          NODE_OPTIONS: --enable-source-maps
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PipTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt ContactTopic.TopicName
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminDisableUser
                - cognito-idp:AdminEnableUser
                - cognito-idp:AdminResetUserPassword
              Resource: !GetAtt AdminUserPool.Arn
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - arn:aws:bedrock:*::foundation-model/*
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:application-inference-profile/*
      Events:
        DailyLibraryRefresh:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)
            Input: '{"pipTask":"refresh-library"}'
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
        Cors:
          AllowOrigins: !Ref AllowedOrigins
          AllowMethods: [GET, POST, PUT, DELETE]
          AllowHeaders: [content-type, authorization]
          MaxAge: 86400

  # Since October 2025 a public Function URL needs lambda:InvokeFunction as well as
  # lambda:InvokeFunctionUrl. SAM adds the URL permission; this adds the other one,
  # limited to calls that come through the function URL.
  PipFunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PipFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

  PipFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${PipFunction}
      RetentionInDays: 90

  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasContactEmail
    Properties:
      AlarmDescription: Pip API is returning errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref PipFunction }
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ContactTopic]

Outputs:
  AdminUrl:
    Description: The admin panel
    Value: https://omag-web.github.io/omag-hr/web/admin/
  UserPoolId:
    Description: The admin user pool (add admins on the Admins page of the admin panel)
    Value: !Ref AdminUserPool
  ApiUrl:
    Description: Put this in web/config.js as apiUrl
    Value: !GetAtt PipFunctionUrl.FunctionUrl
  TableName:
    Value: !Ref PipTable
  ContactTopicArn:
    Value: !Ref ContactTopic
