# Publishes the web pages (web/) to Pip's own address on OMAG's domain whenever they change.
# Does nothing until the stack has a SiteDomain (see docs/deploy.md → "Pip's own web address").
name: Publish web pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/scripts/publish-site.sh'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::237264540272:role/pip-hr-github-deploy
          aws-region: us-east-1
      - run: .github/scripts/publish-site.sh
