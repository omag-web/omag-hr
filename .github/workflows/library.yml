name: Refresh statute library

# Rebuilds backend/data/library.json from the Oklahoma Legislature and eCFR,
# then commits it if anything changed. Runs when the source list or the
# builder changes, monthly, and on demand (Actions tab → Run workflow).
# On main, it also uploads the library to Pip's data bucket in AWS, where Pip
# picks it up within a day (or right away with "Check for updates now").

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 3 * *'   # 3rd of each month, 09:17 UTC
  push:
    paths:
      - 'knowledge/**'
      - '.github/workflows/library.yml'

permissions:
  contents: write
  id-token: write   # AWS access through the pip-hr-github-deploy role (main only)

concurrency:
  group: library-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pdftotext
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils

      - name: Parser tests
        run: node --test knowledge/scripts/parse.test.mjs

      - name: Build library
        run: node knowledge/scripts/build-library.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- backend/data/library.json && git ls-files --error-unmatch backend/data/library.json >/dev/null 2>&1; then
            echo "Library unchanged."
            exit 0
          fi
          git config user.name "pip-library-bot"
          git config user.email "pip-library-bot@users.noreply.github.com"
          git add backend/data/library.json
          git commit -m "Refresh statute library ($(date -u +%Y-%m-%d))"
          git push

      - uses: aws-actions/configure-aws-credentials@v4
        if: github.ref == 'refs/heads/main'
        with:
          role-to-assume: arn:aws:iam::237264540272:role/pip-hr-github-deploy
          aws-region: us-east-1

      - name: Publish to Pip
        if: github.ref == 'refs/heads/main'
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name pip-hr --query "Stacks[0].Outputs[?OutputKey=='DataBucketName'].OutputValue" --output text)
          if [ -z "$BUCKET" ] || [ "$BUCKET" = "None" ]; then echo "The pip-hr stack has no DataBucketName output yet; skipping."; exit 0; fi
          aws s3 cp backend/data/library.json "s3://$BUCKET/published/library.json" --content-type application/json --only-show-errors
          aws s3 cp knowledge/sources.json "s3://$BUCKET/published/sources.json" --content-type application/json --only-show-errors
          echo "Published to s3://$BUCKET/published/"
