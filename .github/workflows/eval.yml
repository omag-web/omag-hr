# Weekly check that Pip still answers well: asks the questions in backend/eval/questions.json
# and checks each answer cites the right laws (and never repeats personal information).
#
# It runs a private copy of Pip inside GitHub using the real AI model and the statute library
# in the repo, so it doesn't use members' daily limits or show up in Conversations.
# Costs about $1–2 in Bedrock per run. If it fails, GitHub emails whoever is watching the repo;
# open the run and read the summary table to see which questions went wrong.
name: Check Pip's answers

on:
  schedule:
    - cron: '17 13 * * 1'   # Mondays, about 8am Central
  workflow_dispatch:
    inputs:
      min:
        description: 'Share of questions that must pass (0–1)'
        default: '0.8'

permissions:
  id-token: write
  contents: read

env:
  STACK: pip-hr
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::237264540272:role/pip-hr-github-deploy

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Use the same AI model as the live site
        run: |
          MODEL=$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Parameters[?ParameterKey=='ModelId'].ParameterValue" --output text)
          echo "MODEL_ID=${MODEL:-us.openai.gpt-5.6-terra}" >> "$GITHUB_ENV"
          echo "Model: ${MODEL}"

      - name: Start a private copy of Pip
        run: |
          DAILY_LIMIT_PER_IP=1000 DAILY_LIMIT_GLOBAL=1000 nohup npm run dev > /tmp/pip.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8787/health && exit 0; sleep 2; done
          cat /tmp/pip.log; exit 1

      - name: Ask the questions
        env:
          PIP_API: http://localhost:8787
          EVAL_MIN: ${{ inputs.min || '0.8' }}
        run: npm run eval

      - name: Server log (if something broke)
        if: failure()
        run: tail -200 /tmp/pip.log
