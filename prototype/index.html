<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pip – OMAG's HR Assistant (Prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#16324f; --navy-2:#1f4166; --navy-3:#24486e; --navy-line:#2c4c6f;
  --accent:#3a6a9a; --accent-dk:#2b5785; --accent-bg:#eaf1f8; --accent-line:#c9daea;
  --gold:#d4a72c; --gold-bg:#fbf6e6; --gold-line:#ecdcaa; --gold-ink:#5c4400;
  --ink:#1c2733; --ink-2:#3c4855; --muted:#5a6675; --line:#e3e7ec; --line-2:#d3dae2;
  --bg:#f6f7f9; --white:#fff;
  --ok:#1f7a4d; --ok-bg:#e8f5ee; --warn:#8a5a00; --warn-bg:#fdf3dc; --bad:#b4332b; --bad-bg:#fbeaea;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Public Sans',system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-dk)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid #7fb0e0;outline-offset:2px}
svg{flex:none}

/* ---------- layout ---------- */
.app{display:flex;height:100vh;height:100dvh;overflow:hidden}
.sidebar{width:280px;flex:none;background:var(--navy);color:#e8eef5;display:flex;flex-direction:column;gap:22px;padding:18px 14px;overflow-y:auto}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--white);position:relative}

/* sidebar */
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px}
.brand-mark{width:38px;height:38px;border-radius:9px;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10.5px;letter-spacing:.2px;border-bottom:3px solid var(--gold)}
.brand-name{font-weight:700;font-size:15px;line-height:1.2}
.brand-sub{font-size:12px;color:#a9bccf}
.ai-name{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:-4px}
.ai-tag{display:inline-flex;padding:1px 6px;border-radius:5px;background:#eef2f6;border:1px solid var(--line-2);color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.5px}
.new-btn{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid #3b5a7a;background:var(--navy-2);color:#fff;font-size:14px;font-weight:600;text-align:left}
.new-btn:hover{background:var(--navy-3);border-color:var(--gold)}
.side-group{display:flex;flex-direction:column;gap:2px}
.side-label{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#a9bccf;padding:0 10px 6px}
.side-item{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border-radius:8px;color:#dbe5ef;font-size:14px;background:none;border:none;border-left:3px solid transparent;text-align:left;width:100%}
.side-item:hover{background:#1f4166;color:#fff}
.side-item.active{background:var(--navy-3);color:#fff;border-left-color:var(--gold)}
.side-item .tag{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.4px;color:#a9bccf}
.profile{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 10px;border-top:1px solid var(--navy-line);background:none;border-left:none;border-right:none;border-bottom:none;color:inherit;text-align:left;border-radius:0;width:100%}
.profile:hover{background:#1b3a5b}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.profile-name{font-size:14px;font-weight:600;display:block}
.profile-sub{font-size:12px;color:#a9bccf;display:block}

/* header */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px;border-bottom:1px solid var(--line);min-height:64px}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0}
.menu-btn{display:none;width:40px;height:40px;border-radius:8px;border:1px solid var(--line-2);background:#fff;align-items:center;justify-content:center}
.title{margin:0;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subtitle{font-size:12.5px;color:var(--muted)}
.demo-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--gold-bg);border:1px solid var(--gold-line);color:var(--gold-ink);font-size:12px;font-weight:600;white-space:nowrap}
.topbar-right{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:#fff;color:var(--ink);font-size:14px;font-weight:600;white-space:nowrap}
.btn:hover{background:#f3f6f9}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-dk);border-color:var(--accent-dk)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}

/* thread */
.thread{flex:1;overflow-y:auto;padding:28px 20px 12px;scroll-behavior:smooth}
.thread-inner{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.msg-user{display:flex;justify-content:flex-end}
.bubble{max-width:82%;background:var(--accent-bg);border-radius:16px 16px 4px 16px;padding:12px 16px;font-size:15px;line-height:1.55}
.file-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:#fff;border:1px solid var(--accent-line);font-size:13.5px;font-weight:600;margin-bottom:8px}
.msg-ai{display:flex;gap:14px;align-items:flex-start}
.ai-mark{flex:none;width:32px;height:32px;border-radius:8px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;border-bottom:2px solid var(--gold)}
.ai-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;font-size:15px;line-height:1.62}
.ai-body p{margin:0}
.block{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.points{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;counter-reset:pt}
.points li{display:flex;gap:10px;counter-increment:pt}
.points li::before{content:counter(pt) ".";color:var(--muted);flex:none;min-width:16px}
.cite{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;margin:0 1px;border-radius:6px;background:var(--accent-bg);border:1px solid var(--accent-line);color:var(--accent-dk);font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1.6;vertical-align:baseline}
.cite:hover{background:#dce9f6;border-color:#a9c4df}
.context-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.context-line .gov{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;background:#f1f4f7;border:1px solid var(--line);color:var(--ink-2);font-weight:600}
.linkish{background:none;border:none;padding:0;color:var(--accent-dk);text-decoration:underline;font-weight:600;font-size:13px}
.callout{display:flex;gap:12px;padding:14px 16px;border-radius:12px;background:var(--gold-bg);border:1px solid var(--gold-line);font-size:14px;line-height:1.55;color:#3d3110}
.callout.legal{background:#f4f7fa;border-color:var(--line-2);color:var(--ink-2)}
.suggest{display:flex;flex-wrap:wrap;gap:8px}
.chip-btn{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--accent-line);background:#fff;color:var(--accent-dk);font-size:14px;font-weight:600}
.chip-btn:hover{background:var(--accent-bg)}
.tools{display:flex;gap:2px;margin-top:-4px}
.icon-btn{width:36px;height:36px;border-radius:8px;border:none;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center}
.icon-btn:hover{background:#f1f4f7;color:var(--ink)}
.icon-btn.on{color:var(--accent-dk);background:var(--accent-bg)}
.typing{display:flex;gap:5px;padding:10px 0}
.typing span{width:7px;height:7px;border-radius:50%;background:#9fb1c4;animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.thinking-label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}

/* checklist */
.checklist{display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:12px;overflow:hidden}
.check-row{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:flex-start;font-size:14px;line-height:1.5}
.check-row:first-child{border-top:none}
.status{flex:none;display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;min-width:84px;justify-content:center}
.status.ok{background:var(--ok-bg);color:var(--ok)}
.status.warn{background:var(--warn-bg);color:var(--warn)}
.status.bad{background:var(--bad-bg);color:var(--bad)}
.status.todo{background:#f1f4f7;color:var(--ink-2)}

/* doc card */
.doc-card{border:1px solid var(--line-2);border-radius:14px;overflow:hidden;display:flex;flex-wrap:wrap;background:#fff}
.doc-thumb{flex:0 0 160px;background:#f1f4f7;padding:16px;display:flex;justify-content:center;align-items:center}
.page-mini{width:112px;height:144px;background:#fff;border-radius:3px;box-shadow:0 1px 4px rgba(22,50,79,.18);padding:11px 10px;display:flex;flex-direction:column;gap:5px}
.page-mini i{display:block;height:4px;border-radius:2px;background:#e3e7ec}
.doc-info{flex:1 1 280px;padding:16px 18px;display:flex;flex-direction:column;gap:9px}
.doc-meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.badge{display:inline-flex;padding:2px 8px;border-radius:6px;background:#e4effa;color:#1f4f80;font-size:12px;font-weight:700}
.doc-title{margin:0;font-size:17px;font-weight:700;line-height:1.35}
.doc-info ul{margin:0;padding-left:18px;font-size:14px;color:var(--ink-2);line-height:1.6}
.doc-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}

/* inline form */
.form-card{border:1px solid var(--line-2);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;background:#fbfcfd}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--muted)}
.input,.select{min-height:42px;padding:0 12px;border-radius:8px;border:1px solid #c4ced8;background:#fff;font-size:14.5px;width:100%}
.input:focus,.select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(58,106,154,.18)}
.form-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.form-foot .hint{font-size:12.5px;color:var(--muted)}

/* welcome */
.welcome{max-width:780px;margin:0 auto;padding:6vh 0 20px;display:flex;flex-direction:column;gap:26px}
.welcome-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.welcome-mark{width:54px;height:54px;border-radius:14px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;border-bottom:3px solid var(--gold)}
.welcome h2{margin:8px 0 0;font-size:31px;font-weight:700;letter-spacing:-.4px;line-height:1.2}
.welcome p{margin:0;font-size:16px;color:var(--muted);max-width:580px;line-height:1.55}
.starters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.starter{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px;border-radius:14px;border:1px solid #e0e5eb;background:#f9fbfd;text-align:left;min-height:88px}
.starter:hover{border-color:var(--accent-line);background:var(--accent-bg)}
.starter-kicker{font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--accent-dk)}
.starter-kicker.doc{color:var(--warn)}
.starter-text{font-size:15px;line-height:1.45}

/* composer */
.composer-wrap{padding:10px 20px 16px;background:#fff}
.composer{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.composer-box{border:1px solid #c4ced8;border-radius:16px;padding:10px 10px 10px 16px;display:flex;flex-direction:column;gap:8px;background:#fff;box-shadow:0 2px 12px rgba(22,50,79,.06)}
.composer-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(58,106,154,.14)}
.composer textarea{border:none;outline:none;resize:none;font-size:15px;line-height:1.5;background:transparent;min-height:26px;max-height:180px}
.composer-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.composer-tools{display:flex;gap:6px;flex-wrap:wrap}
.tool-btn{min-height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line-2);background:#fff;color:var(--ink-2);font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.tool-btn.icon{width:38px;padding:0;justify-content:center}
.tool-btn:hover{background:#f3f6f9}
.send{width:40px;height:40px;border-radius:10px;border:none;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center}
.send:disabled{background:#b9c7d6;cursor:not-allowed}
.disclaimer{margin:0;text-align:center;font-size:12px;color:var(--muted)}

/* slide-over panel */
.scrim{position:fixed;inset:0;background:rgba(14,30,48,.38);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:#fff;z-index:50;transform:translateX(100%);transition:transform .25s ease,visibility .25s;display:flex;flex-direction:column;visibility:hidden}
.panel.show{transform:none;visibility:visible;box-shadow:-8px 0 30px rgba(14,30,48,.18)}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.panel-kicker{font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--accent-dk)}
.panel-title{margin:4px 0 0;font-size:18px;line-height:1.3}
.panel-body{padding:18px 20px;overflow-y:auto;font-size:14.5px;line-height:1.65;color:var(--ink-2)}
.panel-body p{margin:0 0 12px}
.panel-body ol{margin:0 0 12px;padding-left:22px}
.panel-body li{margin-bottom:6px}
.panel-body mark{background:#fdeeb5;color:inherit;padding:0 2px;border-radius:2px}
.panel-source{margin-top:6px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}

/* modal */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal > .scrim{z-index:0}
.modal > .modal-card{z-index:1}
.modal-card{position:relative;background:#fff;border-radius:16px;width:min(560px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(14,30,48,.3);animation:rise .25s ease both}
.modal-card.wide{width:min(860px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h2{margin:0;font-size:17px}
.modal-body{padding:20px;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
.preview-pages{background:#e9edf2;padding:24px;display:flex;flex-direction:column;align-items:center;gap:20px}
.doc-page{width:100%;max-width:640px;background:#fff;box-shadow:0 2px 10px rgba(22,50,79,.15);padding:48px 56px;font-family:Georgia,'Times New Roman',serif;font-size:14px;line-height:1.6;color:#222}
.doc-page h1{font-size:24px;text-align:center;margin:0 0 6px}
.doc-page h2{font-family:'Public Sans',sans-serif;font-size:13px;letter-spacing:.8px;text-transform:uppercase;margin:22px 0 8px;color:var(--navy)}
.doc-page h3{font-family:'Public Sans',sans-serif;font-size:14px;margin:16px 0 6px}
.doc-page p{margin:0 0 10px}
.letterhead{text-align:center;border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:22px}
.letterhead .town{font-family:'Public Sans',sans-serif;font-weight:700;font-size:18px;color:var(--navy)}
.letterhead .sm{font-family:'Public Sans',sans-serif;font-size:12px;color:var(--muted)}
.filled{background:#e9f3e3;border-radius:2px;padding:0 2px}
.blank{background:#fdeeb5;border-radius:2px;padding:0 3px}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px rgba(14,30,48,.3);opacity:0;pointer-events:none;transition:all .25s;z-index:80;max-width:min(520px,90vw);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* responsive */
@media (max-width:900px){
  .sidebar{position:fixed;inset:0 auto 0 0;z-index:45;transform:translateX(-100%);transition:transform .25s ease,visibility .25s;visibility:hidden}
  .sidebar.open{transform:none;visibility:visible;box-shadow:8px 0 30px rgba(14,30,48,.25)}
  .menu-btn{display:inline-flex}
  .topbar{padding:10px 14px}
  .hide-sm{display:none!important}
  .thread{padding:20px 14px 8px}
  .composer-wrap{padding:8px 12px 12px}
  .starters,.form-grid{grid-template-columns:1fr}
  .welcome h2{font-size:25px}
  .bubble{max-width:92%}
  .doc-page{padding:28px 24px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">

  <!-- ===== SIDEBAR ===== -->
  <nav class="sidebar" id="sidebar" aria-label="Conversations and templates">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">OMAG</div>
      <div><div class="brand-name" data-bot-name>Pip</div><div class="brand-sub">OMAG's HR assistant</div></div>
    </div>

    <button class="new-btn" type="button" data-action="new">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New conversation
    </button>

    <div class="side-group">
      <span class="side-label">Recent</span>
      <button type="button" class="side-item" data-recent="fmla_small">FMLA for small towns</button>
      <button type="button" class="side-item" data-recent="clerk">Clerk hiring authority</button>
      <button type="button" class="side-item" data-recent="mayor">Mayor suspending an employee</button>
    </div>

    <div class="side-group">
      <span class="side-label">Document templates</span>
      <button type="button" class="side-item" data-template="handbook">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>
        Personnel policies handbook</button>
      <button type="button" class="side-item" data-template="fmla_policy">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>
        FMLA leave policy</button>
      <button type="button" class="side-item" data-template="receipt">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>
        Policy acknowledgment receipt</button>
    </div>

    <button type="button" class="profile" data-action="profile" aria-label="Edit member profile">
      <span class="avatar" id="avatar" aria-hidden="true">MP</span>
      <span style="min-width:0">
        <span class="profile-name" id="profile-name">Member profile</span>

<script>
(function(){
'use strict';

/* ============ STATE ============ */

};
/* The assistant's display name. Change it here and everywhere updates. */
const BOT = 'Pip';

const F = () => FORMS[state.form];

/* ============ SOURCES (statute text from Title 11; federal regs summarized) ============ */
const ECFR = s => `https://www.ecfr.gov/current/title-29/section-${s}`;
const SOURCES = {
  '12-105':{kicker:'Oklahoma Statutes · Title 11',title:'11 O.S. § 12-105 — Duties of Mayor; Acting Mayor (Statutory Town)',
    body:`<p><mark>The mayor shall preside at meetings of the board</mark> and shall certify to the correct enrollment of all ordinances and resolutions passed by it. He shall be recognized as head of the town government for all ceremonial purposes and shall have such other powers, duties and functions as may be prescribed by law or ordinance. <mark>The mayor shall have all the powers, rights, privileges, duties and responsibilities of a trustee</mark>, including the right to vote on questions.</p><p>During the absence, disability or suspension of the mayor, the board shall elect from among its members an acting mayor…</p>`},
  '12-106':{kicker:'Oklahoma Statutes · Title 11',title:'11 O.S. § 12-106 — Designated Powers Vested in Board of Trustees',
    body:`<p>All powers of a statutory town board of trustees, including the determination of matters of policy, shall be vested in the board of trustees. Without limitation of the foregoing, the board may:</p><ol><li><mark>appoint and remove, and confirm appointments of, designated town officers and employees as provided by law or ordinance;</mark></li><li>enact municipal legislation…;</li><li>raise revenue, establish rates for services and taxes, make appropriations, regulate salaries and wages and all other fiscal affairs of the town…;</li><li>inspect the books and accounts maintained by the town treasurer;</li><li>inquire into the conduct of any office, department or agency of the town…;</li><li>create, change and abolish offices, departments or agencies, other than those established by law; assign additional functions and duties to offices, departments and agencies established by this article; and define the duties, powers and privileges of all officers which are not defined by this article; and</li><li>grant pardons for violation of municipal ordinances…</li></ol>`},
  '12-109':{kicker:'Oklahoma Statutes · Title 11',title:'11 O.S. § 12-109 — Town Clerk: Creation and Duties',
    body:`<p>The town clerk shall be an officer of the town. The town clerk shall:</p><ol><li>keep the journal of the proceedings of the board of trustees; and</li><li>enroll all ordinances and resolutions passed by the board of trustees…; and</li><li>have custody of documents, records, and archives, as may be provided for by law or by ordinance, and have custody of the town seal; and</li><li>attest and affix the seal of the town to documents as required by law or by ordinance; and</li><li>have such other powers, duties, and functions <mark>related to his statutory duties</mark> as may be prescribed by law or by ordinance. The person who serves as town clerk may be employed by the town to perform duties not related to his position as town clerk…</li></ol>`},
  '12-114':{kicker:'Oklahoma Statutes · Title 11',title:'11 O.S. § 12-114 — Appointments and Removals (Statutory Town)',
    body:`<p>Appointments and promotions in the service of a statutory town board of trustees government shall be made solely on the basis of merit and fitness; and <mark>removals, demotions, suspensions, and layoffs shall be made solely for the good of the service.</mark> The board by ordinance may establish a merit system and provide for its organization and functioning and provide for personnel administration and regulation of personnel matters. The board of trustees may remove for cause any appointive officer by a majority vote of all its members.</p>`},
  '9-105':{kicker:'Oklahoma Statutes · Title 11',title:'11 O.S. § 9-105 — Mayor: Duties as Chief Executive Officer (Aldermanic)',
    body:`<p>The mayor shall be chief executive officer of the administrative branch of the government of the city… The mayor shall:</p><ol><li><mark>appoint, subject to the confirmation by the city council, a city attorney and all heads or directors of administrative departments</mark> including members of boards and commissions <mark>and shall appoint all other administrative officers and employees of the city</mark>; and</li><li>sign the commissions and appointments of all officers, elected, or appointed; and</li><li><mark>remove or suspend city officers or employees against whom charges of incompetency, neglect, or violation of duty are made, until such time as the council shall act on the charges</mark>; and</li><li>supervise and control all administrative departments, agencies, officers and employees…</li></ol><p>…and have such other powers, duties, and functions as may be prescribed by law or by ordinance.</p>`},
  '9-112':{kicker:'Oklahoma Statutes · Title 11',title:'11 O.S. § 9-112 — City Clerk: Creation and Duties (Aldermanic)',
    body:`<p>The city clerk shall be an officer of the city. The clerk shall serve as clerk for the council. The city clerk shall keep the journal of the proceedings of the city council; enroll all ordinances and resolutions…; have custody of documents, records, and archives…; attest and affix the seal of the city…; and have such other powers, duties, and functions <mark>related to his statutory duties</mark> as may be prescribed by law or by ordinance.</p>`},
  '9-117':{kicker:'Oklahoma Statutes · Title 11',title:'11 O.S. § 9-117 — Appointments and Removals (Aldermanic)',
    body:`<p>Appointments and promotions in the service of a statutory aldermanic city shall be made solely on the basis of merit and fitness. Removals, demotions, suspensions, and layoffs shall be made solely for the good of the service. <mark>The council may suspend for cause, by a majority vote of all its members, any officer of the city except the mayor.</mark> The council by ordinance may establish a system for appointment and removal of employees on the basis of merit…</p>`},
  '10-105':{kicker:'Oklahoma Statutes · Title 11',title:'11 O.S. § 10-105 — Duties of the Mayor and Vice-Mayor (Council-Manager)',
    body:`<p>The mayor shall preside at meetings of the council and shall certify to the correct enrollment of all ordinances and resolutions passed by it. He shall be recognized as head of the city government for all ceremonial purposes and by the Governor for purposes of military law. <mark>He shall have no regular administrative duties</mark> except that he shall sign all conveyances and other written obligations of the city as the council may require…</p>`},
  '10-107':{kicker:'Oklahoma Statutes · Title 11',title:'11 O.S. § 10-107 — Council Acts Through the City Manager',
    body:`<p>Except for the purposes of inquiry, <mark>the council and its members shall deal with the administrative service of the city solely through the city manager.</mark> The council and its members may not:</p><ol><li>Direct or request the city manager or other authority to appoint or remove officers or employees;</li><li>Participate in any manner in the appointment or removal of officers and employees of the city, except as provided by law; or</li><li>Give orders on ordinary administrative matters to any subordinate of the city manager either publicly or privately.</li></ol>`},
  '10-113':{kicker:'Oklahoma Statutes · Title 11',title:'11 O.S. § 10-113 — City Manager: Duties',
    body:`<p>The city manager shall be the chief executive officer and head of the administrative branch of the city government… He shall:</p><ol><li><mark>Appoint, and when necessary for the good of the service, remove, demote, lay off or suspend all heads of administrative departments and other administrative officers and employees of the city</mark> except as otherwise provided by law. <mark>The manager or the council by ordinance may authorize the head of a department, office or agency to appoint and remove the subordinates</mark> in such department, office or agency;</li><li>Supervise and control all administrative departments, officers and agencies;</li></ol><p>…and perform such other duties as may be prescribed by law or by ordinance.</p>`},
  '11-106':{kicker:'Oklahoma Statutes · Title 11',title:'11 O.S. § 11-106 — Mayor: Duties as Chief Executive Officer (Strong-Mayor-Council)',
    body:`<p>The mayor shall be chief executive officer and head of the administrative branch of the city government… He shall:</p><ol><li><mark>Appoint, and when necessary for the good of the service, remove, demote, lay off, or suspend all heads or directors of administrative departments and all other administrative officers and employees of the city in the manner provided by law.</mark> The mayor or the council by ordinance may authorize the head of a department, office or agency to appoint and remove subordinates in such department, office or agency;</li><li>Supervise and control, directly or indirectly, all administrative departments, agencies, officers and employees;</li></ol>`},
  '11-118':{kicker:'Oklahoma Statutes · Title 11',title:'11 O.S. § 11-118 — Appointments and Removals; Personnel Department',
    body:`<p>Appointments and promotions in the service of a statutory strong-mayor-council city shall be made solely on the basis of merit and fitness; and removals, demotions, suspensions, and layoffs shall be made solely for the good of the service. <mark>The council by ordinance may establish a merit system</mark>… If and when the council establishes a merit system, it shall create a personnel department, the head of which shall be a personnel director appointed by the mayor for an indefinite term…</p>`},
  'charter':{kicker:'Oklahoma Statutes · Title 11 / OML Handbook',title:'Charter cities (11 O.S. §§ 13-101 to 13-116)',
    body:`<p>A city with a population of more than 2,000 may adopt a charter, which then becomes the organic law of the city. A charter may provide for any form, or combination, of government.</p><p>The Oklahoma Supreme Court has held that <mark>charter provisions, when not inconsistent with the Constitution, supersede the statutes pertaining to municipal affairs</mark> — including the form of government and the distribution of powers among departments and the governing body.</p>`},
  '825.104':{kicker:'Federal regulation · FMLA',title:'29 C.F.R. § 825.104 — Covered employer',url:ECFR('825.104'),
    body:`<p><strong>Summary:</strong> A "public agency" — which includes a state, a political subdivision of a state, and any agency of either — is a covered employer under the FMLA <mark>regardless of the number of employees it has.</mark> Private employers are covered only at 50+ employees; public employers have no headcount threshold.</p>`},
  '825.110':{kicker:'Federal regulation · FMLA',title:'29 C.F.R. § 825.110 — Eligible employee',url:ECFR('825.110'),
    body:`<p><strong>Summary:</strong> To be eligible for FMLA leave, an employee must:</p><ol><li>have been employed by the employer for at least 12 months (they need not be consecutive);</li><li>have at least 1,250 hours of service in the 12 months before leave begins; and</li><li><mark>be employed at a worksite where the employer has at least 50 employees within 75 miles.</mark></li></ol><p>A public agency is covered regardless of size, but its employees must still meet this test to be eligible.</p>`},
  '825.300':{kicker:'Federal regulation · FMLA',title:'29 C.F.R. § 825.300 — Employer notice requirements',url:ECFR('825.300'),
    body:`<p><strong>Summary:</strong></p><ol><li><mark>Every covered employer must post the FMLA general notice</mark> where employees and applicants can see it — even if it has no FMLA-eligible employees.</li><li>If the employer has any eligible employees, the general notice must also be <mark>included in the employee handbook</mark> (or distributed to each new employee at hire).</li><li>When an employee requests leave, the employer must provide an eligibility notice, generally within five business days.</li></ol>`},
  '825.200':{kicker:'Federal regulation · FMLA',title:'29 C.F.R. § 825.200 — Amount of leave; the 12-month period',url:ECFR('825.200'),
    body:`<p><strong>Summary:</strong> Eligible employees get up to 12 workweeks of leave in a 12-month period. <mark>The employer must choose one method</mark> for measuring that 12-month period and apply it consistently to all employees:</p><ol><li>the calendar year;</li><li>any fixed 12-month "leave year";</li><li>12 months measured forward from the date an employee's first FMLA leave begins; or</li><li>a "rolling" 12 months measured backward from the date leave is used.</li></ol><p>If the employer doesn't select a method, the employee may use whichever is most beneficial to them.</p>`},
  '825.207':{kicker:'Federal regulation · FMLA',title:'29 C.F.R. § 825.207 — Substitution of paid leave',url:ECFR('825.207'),
    body:`<p><strong>Summary:</strong> FMLA leave is generally unpaid, but an employee may choose — or the employer may require — that accrued paid leave (sick, vacation, PTO) be substituted for unpaid FMLA leave. The employer's normal leave policy conditions apply, and the policy should state clearly whether substitution is required.</p>`},
  '825.126':{kicker:'Federal regulation · FMLA',title:'29 C.F.R. §§ 825.126–.127 — Military family leave',url:ECFR('825.126'),
    body:`<p><strong>Summary:</strong> The FMLA provides two military family leave entitlements: <mark>qualifying exigency leave</mark> (up to 12 weeks) related to a family member's covered active duty, and <mark>military caregiver leave</mark> (up to 26 weeks in a single 12-month period) to care for a covered servicemember with a serious injury or illness. A compliant policy should address both.</p>`},
  '825.305':{kicker:'Federal regulation · FMLA',title:'29 C.F.R. § 825.305 — Medical certification',url:ECFR('825.305'),
    body:`<p><strong>Summary:</strong> An employer may require medical certification to support leave for a serious health condition. The employer should request it in writing, generally within five business days of the leave request, and give the employee at least 15 calendar days to provide it.</p>`},
  'omag-fmla':{kicker:'OMAG template',title:'OMAG Sample Employee and Family Member FMLA Policy',
    body:`<p>OMAG's sample FMLA policy covers the purpose of the Act, definitions, eligibility, leave entitlement, the 12-month measuring period, notice, certification, benefits and job restoration, with citations to 29 C.F.R. Part 825.</p><p>The template notes that it should be reviewed by the municipal attorney before distribution so it accurately reflects the ordinances, policies and practices adopted by the governing body.</p>`},
  'omag-handbook':{kicker:'OMAG template',title:'OMAG Sample Employee Personnel Policy',
    body:`<p>OMAG maintains sample employee personnel policies for each statutory form of government — Statutory Town, Aldermanic, Strong-Mayor and Council-Manager — each written around that form's Title 11 authority sections and incorporating employment at-will status.</p><p>The governing body must approve the policy before it is distributed, and each employee should sign the Receipt and Acknowledgment page.</p>`}
};

/* ============ HELPERS ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cite = (id, label) => `<button type="button" class="cite" data-cite="${id}">${label}</button>`;
const statute = s => cite(s, `11 O.S. § ${s}`);
const cfr = (s, label) => cite(s, label || `29 C.F.R. § ${s}`);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const thread = $('#thread'), inner = $('#thread-inner');
function scrollDown(){ thread.scrollTop = thread.scrollHeight; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),3200); }
function govLine(){
  return `<div class="context-line">Answering for your <span class="gov">${esc(F().label)}</span><button type="button" class="linkish" data-action="profile">Change</button></div>`;
}
const ICON = {
  info:`<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7a5a00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top:2px"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>`,
  scale:`<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3c4855" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top:2px"><path d="M12 3v18M5 21h14M6 7h12M6 7l-3 7a3 3 0 0 0 6 0zM18 7l-3 7a3 3 0 0 0 6 0z"/></svg>`,
  file:`<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>`,
  dl:`<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>`,
  eye:`<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>`
};
const callout = html => `<div class="callout">${ICON.info}<div>${html}</div></div>`;
const legal = (topic) => `<div class="callout legal">${ICON.scale}<div>${topic || 'Because this involves statutory authority, confirm the answer with your municipal attorney or OMAG Legal Services before acting — especially if your ordinances or personnel policy delegate this authority differently.'}</div></div>`;
const suggest = items => `<div class="suggest">${items.map(([label,q])=>`<button type="button" class="chip-btn" data-ask="${esc(q||label)}">${esc(label)}</button>`).join('')}</div>`;

/* ============ ANSWERS ============ */
const A = {};

A.fmla_small = () => ({ title:'FMLA for small towns', blocks:[
  `<p><strong>Short answer:</strong> your ${F().unit.toLowerCase()} is covered by the FMLA, but at around 30 employees most of your staff likely aren't <em>eligible</em> for it.</p>`,
  `<ol class="points">
    <li><span><strong>Every municipality is a covered employer.</strong> Public agencies are covered no matter how many people they employ. ${cfr('825.104','29 C.F.R. § 825.104')}</span></li>
    <li><span><strong>Employees still have to meet the eligibility test:</strong> 12 months of employment, 1,250 hours in the last 12 months, and a worksite with 50 or more employees within 75 miles. With about 30 employees, the 50-employee test usually isn't met. ${cfr('825.110')}</span></li>
    <li><span><strong>You must still post the FMLA notice and keep a compliant policy,</strong> even if no one is currently eligible. ${cfr('825.300')}</span></li>
  </ol>`,
  callout(`<strong>Count carefully.</strong> The 50-employee count includes everyone on the payroll, part-time staff too, and it's measured when the employee asks for leave, so a ${F().unit.toLowerCase()} near the line can cross it during seasonal hiring. And if your personnel policy promises FMLA-style leave to everyone, you may be bound by that promise even where federal law doesn't require it.`),
  suggest([['Create our FMLA policy','Create our FMLA policy from the OMAG sample'],['Is our handbook FMLA compliant?'],['What must the poster say?']])
]});

A.clerk = () => {
  const f = state.form; let b;
  if (f==='town') b = [
    `<p><strong>Not by statute.</strong> In a Statutory Town, the authority to hire belongs to the Board of Trustees. The clerk can only exercise it if an ordinance gives it to them.</p>`,
    `<ol class="points">
      <li><span><strong>The board holds appointment power.</strong> The Board of Trustees may "appoint and remove, and confirm appointments of, designated town officers and employees as provided by law or ordinance." ${statute('12-106')}</span></li>
      <li><span><strong>The clerk's statutory duties are records duties</strong> — the journal, ordinances, custody of records and the seal — plus other functions <em>related to</em> those duties. Hiring isn't among them. ${statute('12-109')}</span></li>
      <li><span><strong>Hiring must be based on merit and fitness,</strong> whoever does it, and the board may set up personnel administration by ordinance. ${statute('12-114')}</span></li>
    </ol>`,
    callout(`<strong>Statute vs. local practice.</strong> Many towns let the clerk run hiring day to day — posting jobs, interviewing, recommending. That's fine as practice, but the final decision still sits with the board unless an ordinance assigns it elsewhere. Check your ordinances and personnel policy for a delegation.`)];
  else if (f==='aldermanic') b = [
    `<p><strong>No — in an Aldermanic city, the mayor appoints employees.</strong> The clerk can support the process, but the appointment is the mayor's.</p>`,
    `<ol class="points">
      <li><span><strong>The mayor appoints</strong> department heads (subject to council confirmation) and "all other administrative officers and employees of the city." ${statute('9-105')}</span></li>
      <li><span><strong>The clerk's statutory duties are records duties</strong> and functions related to them. Hiring isn't among them. ${statute('9-112')}</span></li>
    </ol>`,
    callout(`<strong>Statute vs. local practice.</strong> If your clerk runs recruiting, make sure the mayor makes and documents the final appointment.`)];
  else if (f==='cm') b = [
    `<p><strong>Only if it's been delegated.</strong> In a Council-Manager city, the city manager appoints employees, though the manager or council can authorize a department head to hire within their department.</p>`,
    `<ol class="points">

/* ============ ROUTER ============ */
function route(q){
  const t = q.toLowerCase();
  if (/upload our charter/.test(t)) return A.upload_charter();
  if (/suspension notice/.test(t)) return A.suspension_notice();
  if (/poster|post.*notice|notice.*say/.test(t)) return A.poster();
  if (/12.month|four.*method|rolling/.test(t)) return A.methods();
  if (/acknowledg|receipt/.test(t)) return A.receipt();
  if (/(create|draft|write|build|make).*(fmla).*(policy)|fmla policy|fmla leave policy/.test(t)) return A.fmla_policy();
  if (/handbook|personnel polic/.test(t) && /complian|check|review/.test(t)) return A.compliant();
  if (/(build|create|draft|make|write).*(handbook|personnel polic)|^personnel policies handbook/.test(t)) return A.handbook_ask();
  if (/(clerk).*(hir|appoint)|hiring authority|who (can|may) hire/.test(t)) return A.clerk();
  if (/(mayor).*(suspend|fire|discipline|terminate|remove)|suspend/.test(t)) return A.mayor();
  if (/fmla/.test(t)) return A.fmla_small();
  return A.fallback(q);
}

  inner.appendChild(wrap); scrollDown();
  await sleep(900 + Math.random()*500);
  const body = wrap.querySelector('.ai-body'); body.querySelector('.thinking-label').remove();
  if (ans.title && $('#conv-title').textContent==='New conversation') $('#conv-title').textContent = ans.title;
  for (const html of ans.blocks){
    const d = document.createElement('div'); d.className='block'; d.innerHTML = html;
    body.appendChild(d);
    scrollDown(); await sleep(220);

    <form id="profile-form" style="display:flex;flex-direction:column;gap:14px">
      <div class="field"><label for="pf-name">Your name</label><input class="input" id="pf-name" value="${esc(state.name)}" placeholder="e.g. Jordan Smith"></div>
      <div class="field"><label for="pf-muni">Municipality</label><input class="input" id="pf-muni" value="${esc(state.muni)}"></div>
      <div class="field"><label for="pf-form">Form of government</label>
        <select class="select" id="pf-form">${Object.entries(FORMS).map(([k,v])=>`<option value="${k}" ${k===state.form?'selected':''}>${v.label}</option>`).join('')}</select>
        <span class="hint">Answers about authority depend on this. In the live tool it's set once per member and saved.</span></div>
    </form>`,
    `<button type="button" class="btn" data-action="close-modal">Cancel</button><button type="button" class="btn primary" data-action="save-profile">Save</button>`);
}
function saveProfile(){
  const prev = state.form;
  state.name = $('#pf-name').value.trim();
  state.muni = $('#pf-muni').value.trim() || state.muni;
  state.form = $('#pf-form').value;
  if (/^(Town|City) of Example$/.test(state.muni)) state.muni = F().unit + ' of Example';
  renderProfile(); closeModal();
  if (!started) renderWelcome();
  if (prev !== state.form) toast(`Now answering as a ${F().label}. Ask again to see how the answer changes.`);
}
function renderProfile(){
  $('#profile-name').textContent = state.name || 'Member profile';
  $('#profile-sub').textContent = `${state.muni} · ${F().label}`;
  const ini = (state.name||'Member Profile').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
  $('#avatar').textContent = ini;
}

function openTemplates(){

/* --- document preview / download --- */
const B = (v, fallback) => (v!==undefined && String(v).trim()!=='') ? `<span class="filled">${esc(v)}</span>` : `<span class="blank">${fallback||'________'}</span>`;
function docHTML(id){
  const d = state.docs[id]; const f = F(); const U = f.unit;
  const head = `<div class="letterhead"><div class="town">${esc(state.muni)}</div><div class="sm">${esc(f.label)} · Oklahoma</div></div>`;
  if (d.kind==='fmla') return `<div class="doc-page">${head}
    <h1>Employee and Family Member FMLA Policy</h1>
    <p style="text-align:center;font-size:12px;color:#666;margin-bottom:22px">Adopted by the ${esc(f.body)} on ${B('','[DATE]')}</p>
    <p><strong>TO:</strong> Department Directors / Division Managers<br><strong>FROM:</strong> ${B(d.from)}<br><strong>SUBJECT:</strong> Family and Medical Leave Act of 1993 – Employee and Family Member</p>
    <h2>I. Purpose of the Act</h2>
    <p>The FMLA allows eligible employees to take up to 12 weeks of unpaid leave in a 12-month period for medical reasons; the birth or adoption of a child; and the care of a child, spouse, or parent of the employee who has a serious health condition. (§ 825.200(a)).</p>
    <h2>II. Definitions</h2>
    <h3>H. FMLA 12-Month Period</h3>
    <p>The 12-month period is measured forward from the date an employee's first FMLA leave begins. Example: If an employee's FMLA 12-month period begins on June 9 it will run until the following June 8. (§ 825.200(b)(4)).</p>
    <h2>III. Eligibility Requirements</h2>
    <p>To be eligible for leave under the FMLA, an employee must have been employed by ${B(state.muni)} for at least 12 months within the past seven years and worked at least 1,250 hours during the previous 12-month period preceding the request for leave. (§ 825.110).</p>
    <p style="color:#888;font-style:italic;margin-top:24px">— Preview shows the first sections. The full policy continues with leave entitlement, notice, certification, benefits and job restoration. —</p></div>`;
  if (d.kind==='receipt') return `<div class="doc-page">${head}
    <h1>Employee Personnel Policy</h1><h2 style="text-align:center">Receipt and Acknowledgment</h2>
    <p>I acknowledge that I have received a copy of the ${B(state.muni)} Employee Personnel Policy. I understand that it is my responsibility to read and comply with the policies it contains and any revisions made to it.</p>
    <p>I understand that the policy is not a contract of employment, and that my employment with the ${U} is at-will. The ${U} may change its policies at any time.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:40px;font-family:'Public Sans',sans-serif;font-size:12px;color:#555">
      <div style="border-top:1px solid #333;padding-top:6px">Employee signature</div><div style="border-top:1px solid #333;padding-top:6px">Date</div>
      <div style="border-top:1px solid #333;padding-top:6px">Employee name (printed)</div><div style="border-top:1px solid #333;padding-top:6px">Supervisor signature</div>
    </div></div>`;
  // handbook
  const auth = {
    town:`<h3>Authority (11 O.S. § 12-106)</h3><p>The Board of Trustees may appoint and remove, and confirm appointments of designated town officers and employees as provided by law or ordinance. The Board of Trustees may inquire into the conduct of any office, department or agency of the Town, and investigate municipal affairs, or authorize and provide such inquiries.</p>`,
    aldermanic:`<h3>Authority (11 O.S. §§ 9-105 and 9-117)</h3><p>The Mayor shall serve as the Chief Executive Officer of the administrative branch of the City… The Mayor shall also appoint, subject to the confirmation by the City Council, a City Attorney and all heads or directors of administrative departments and all other administrative officers and employees of the City. All appointments and promotions shall be made solely on the basis of merit and fitness.</p>`,
    cm:`<h3>Authority (11 O.S. § 10-113)</h3><p>The City Manager serves as the Chief Executive Officer and Head of the administrative branch of the City and supervises and controls all departments, officers and agencies of the City. The City Manager shall appoint, and when necessary for the good of the service, remove, demote, lay-off or suspend all heads of administrative departments and other administrative officers and employees of the City except as otherwise provided by law.</p>`,
    strong:`<h3>Authority (11 O.S. § 11-106)</h3><p>The Mayor serves as the Chief Administrative Officer and head of the administrative branch of the City and supervises and controls all departments, officers and agencies of the City. The Mayor shall appoint, and when necessary for the good of the service, remove, demote, lay off or suspend all heads of administrative departments and other administrative officers and employees of the City except as otherwise provided by law.</p>`
  };
  auth.charter = auth.cm.replace('</p>',' <span class="blank">[Confirm against city charter]</span></p>');
  return `<div class="doc-page">${head}
    <h1>Employee Personnel Policy</h1>
    <p style="text-align:center;font-size:12px;color:#666;margin-bottom:22px">Approved by the ${esc(f.body)} of ${esc(state.muni)} on ${B('','[DATE]')}</p>
    <h2>Introduction</h2>
    <p>This handbook is intended to be an informative guide to employees of the ${B(state.muni)} ("${U}") regarding its policies, procedures, and benefits. The ${U} is proud of the procedures and policies that we have developed. We think you will find that they reflect our commitment to treating our employees fairly.</p>
    <p><strong>Disclaimer:</strong> This handbook is provided as a guide and is not to be considered a contract. The ${U} reserves the right to make changes to its policies, procedures, and other statements made in the handbook… No such change in the Employee Personnel Policy shall modify the at-will nature of employment at the ${U}.</p>
    <h2>General Policies and Procedures</h2>${auth[state.form]}
    <h3>Personnel Records</h3>
    <p>All individual records, computer generated employee reports, personnel files, and information therein, except those specified by ordinance or statute as public records, shall be restricted as confidential, and shall be available only with the approval of the ${B(d.cust)}.</p>
    <h3>Pension or Retirement Benefits</h3>
    <p>The ${U} pays monthly premiums into the ${B(d.ret,'[RETIREMENT PLAN]')} for your retirement. Please see the payroll clerk for details.</p>
    <h3>Sick Leave</h3>
    <p>No employee will be eligible for Sick Leave until such time that the employee has ${B(d.wait,'___')} months of service with the ${U}. At that time, an employee will be eligible for ${B(d.first,'___')} hours of Sick Leave for the following six months. After that, the employee is eligible for ${B(d.after,'___')} hours of sick leave for each six months of continuous service.</p>
    <p>An employee may accumulate no more than ${B(d.max,'___')} hours of sick leave. Accumulated sick leave is not compensable upon termination of employment.</p>
    <p style="color:#888;font-style:italic;margin-top:24px">— Preview shows selected sections. Green = filled from your answers; yellow = still needs your input. —</p></div>`;
}
function previewDoc(id){
  const d = state.docs[id]; if(!d) return;
  openModal(d.title, `<div class="preview-pages">${docHTML(id)}</div>`,
    `<button type="button" class="btn" data-action="close-modal">Close</button><button type="button" class="btn primary" data-doc-download="${id}">${ICON.dl} Download Word</button>`, true);
}
let docxLib = null;
function loadDocxLib(){
  if (window.docx) return Promise.resolve(window.docx);
  if (docxLib) return docxLib;
  docxLib = new Promise((res, rej)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js';
    sc.onload = ()=> window.docx ? res(window.docx) : rej(new Error('lib'));
    sc.onerror = ()=>{ docxLib = null; rej(new Error('load')); };
    document.head.appendChild(sc);
  });
  return docxLib;
}
/* Convert the preview page's HTML into a real .docx (headings, paragraphs, highlighted blanks). */
async function buildDocx(id){
  const D = await loadDocxLib();
  const { Document, Packer, Paragraph, TextRun, AlignmentType, BorderStyle } = D;
  const tpl = document.createElement('div'); tpl.innerHTML = docHTML(id);
  const page = tpl.querySelector('.doc-page');
  const runs = (node, base={}) => {
    const out = [];
    node.childNodes.forEach(n=>{
      if (n.nodeType===3){ const t=n.textContent.replace(/\s+/g,' '); if(t) out.push(new TextRun(Object.assign({text:t}, base))); }
      else if (n.nodeType===1){
        if (n.tagName==='BR'){ out.push(new TextRun({break:1})); return; }
        const o = Object.assign({}, base);
        if (n.tagName==='STRONG'||n.tagName==='B') o.bold = true;
        if (n.tagName==='EM'||n.tagName==='I') o.italics = true;
        if (n.classList.contains('blank')) o.highlight = 'yellow';
        out.push(...runs(n, o));
      }
    });
    return out;
  };
  const kids = [];
  page.childNodes.forEach(n=>{
    if (n.nodeType!==1) return;
    if (n.classList.contains('letterhead')){
      kids.push(new Paragraph({alignment:AlignmentType.CENTER, children:[new TextRun({text:n.querySelector('.town').textContent, bold:true, size:30, color:'16324F', font:'Arial'})]}));
      kids.push(new Paragraph({alignment:AlignmentType.CENTER, spacing:{after:240}, border:{bottom:{color:'3A6A9A', space:6, style:BorderStyle.SINGLE, size:12}}, children:[new TextRun({text:n.querySelector('.sm').textContent, size:18, color:'555555', font:'Arial'})]}));
      return;
    }
    if (/color:#888/.test(n.getAttribute('style')||'')) return;
    const centered = n.tagName==='H1' || /text-align:center/.test(n.getAttribute('style')||'');
    if (n.tagName==='H1') kids.push(new Paragraph({alignment:AlignmentType.CENTER, spacing:{before:120,after:80}, children:runs(n,{bold:true,size:40,font:'Georgia'})}));
    else if (n.tagName==='H2') kids.push(new Paragraph({alignment:centered?AlignmentType.CENTER:undefined, spacing:{before:320,after:120}, children:runs(n,{bold:true,size:21,color:'16324F',font:'Arial',allCaps:true})}));
    else if (n.tagName==='H3') kids.push(new Paragraph({spacing:{before:220,after:80}, children:runs(n,{bold:true,size:22,font:'Arial'})}));
    else if (n.tagName==='P') kids.push(new Paragraph({alignment:centered?AlignmentType.CENTER:undefined, spacing:{after:160,line:300}, children:runs(n,{size:23,font:'Georgia'})}));
    else if (n.tagName==='DIV'){ // signature grid
      kids.push(new Paragraph({spacing:{before:480}, children:[]}));
      n.querySelectorAll(':scope > div').forEach(c=> kids.push(new Paragraph({spacing:{before:480,after:60}, border:{top:{color:'333333',space:4,style:BorderStyle.SINGLE,size:6}}, children:[new TextRun({text:c.textContent, size:18, color:'555555', font:'Arial'})]})));
    }
  });
  const doc = new Document({ creator:`${BOT} – OMAG's HR assistant (prototype)`, title: state.docs[id].title, sections:[{ properties:{page:{margin:{top:1440,bottom:1440,left:1440,right:1440}}}, children: kids }] });
  return Packer.toBlob(doc);
}
let downloadsNS;
async function getDownloads(){
  if (downloadsNS !== undefined) return downloadsNS;
  try { downloadsNS = (window.claude && typeof window.claude.use==='function') ? await window.claude.use('downloads') : null; }
  catch(e){ downloadsNS = null; }
  return downloadsNS;
}
async function downloadDoc(id){
  const d = state.docs[id]; if(!d) return;
  const filename = d.title.replace(/[^\w\- ]+/g,'').replace(/\s+/g,'_') + '.docx';
  toast('Preparing the Word document…');
  let blob;
  try { blob = await buildDocx(id); }
  catch(e){ toast('Couldn\'t build the Word file in this view. The live tool produces a .docx from OMAG\'s template.'); return; }
  const dl = await getDownloads();
  if (dl){
    try { await dl.save({ filename, data: blob }); toast('Saved. The live tool fills in OMAG\'s full template.'); }
    catch(err){ const c = err && err.code; if (c==='declined') toast('Download cancelled.'); else if (c==='rate_limited') toast('A download prompt is already open.'); else toast('Downloads aren\'t available in this view.'); }
    return;
  }
  try{
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    toast('Downloaded. The live tool fills in OMAG\'s full template.');
  }catch(e){ toast('Downloads aren\'t available in this view.'); }
}

/* ============ SIDEBAR / NAV ============ */
function setActive(key){ document.querySelectorAll('[data-recent]').forEach(b=>b.classList.toggle('active', b.dataset.recent===key)); }
function closeSidebar(){ $('#sidebar').classList.remove('open'); }
const RECENT = {
  fmla_small:'We\'re a town of about 30 employees. Do we have to follow FMLA?',
  clerk:'Does our town clerk have hiring authority?',
  mayor:'Can the mayor suspend an employee unilaterally?'
};

/* ============ EVENTS ============ */
const ta = $('#prompt');
function updateSend(){ $('#send').disabled = state.busy || !ta.value.trim(); }
ta.addEventListener('input', ()=>{ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,180)+'px'; updateSend(); });
ta.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); $('#composer').requestSubmit(); } });
$('#composer').addEventListener('submit', e=>{ e.preventDefault(); const q=ta.value.trim(); if(!q||state.busy) return; ta.value=''; ta.style.height='auto'; updateSend(); ask(q); });

document.addEventListener('submit', e=>{
  const f = e.target.closest('[data-form="handbook"]'); if(!f) return;
  e.preventDefault(); if (state.busy) return;
  const v = Object.fromEntries(new FormData(f).entries());
  f.querySelectorAll('input,select,button').forEach(el=>el.disabled=true);
  const summary = `${v.muni}: records approved by ${v.cust}; ${v.ret?v.ret+' retirement; ':''}sick leave ${v.wait||'?'}-month wait, ${v.first||'?'} then ${v.after||'?'} hrs, max ${v.max||'?'}.`;
  ask(summary, {answer: A.handbook_done(v)});
});

document.addEventListener('click', e=>{
  const sb=$('#sidebar'); if(sb.classList.contains('open') && !e.target.closest('#sidebar') && !e.target.closest('[data-action="menu"]')) closeSidebar();
  const t = e.target.closest('button,[data-action],a'); if(!t) return;
  if (t.dataset.cite){ openCite(t.dataset.cite); return; }
  if (t.dataset.ask){ closeModal(); ask(t.dataset.ask); return; }
  if (t.dataset.recent){ renderWelcome(); setActive(t.dataset.recent); ask(RECENT[t.dataset.recent]); return; }
  if (t.dataset.template){ closeModal(); const map={handbook:'Build our personnel policies handbook',fmla_policy:'Create our FMLA policy from the OMAG sample',receipt:'Create a policy acknowledgment receipt'}; ask(map[t.dataset.template]); return; }
  if (t.dataset.docPreview){ previewDoc(t.dataset.docPreview); return; }
  if (t.dataset.docDownload){ downloadDoc(t.dataset.docDownload); return; }
  const a = t.dataset.action; if(!a) return;
  switch(a){
    case 'new': closeSidebar(); renderWelcome(); ta.focus(); break;
    case 'menu': $('#sidebar').classList.toggle('open'); break;
    case 'profile': closeSidebar(); openProfile(); break;
    case 'save-profile': saveProfile(); break;
    case 'contact': openContact(); break;
    case 'send-omag': closeModal(); toast('Sent. In the live tool, this goes to OMAG staff with the full conversation attached.'); break;
    case 'templates': openTemplates(); break;
    case 'close-modal': closeModal(); break;
    case 'close-panel': closePanel(); break;
    case 'attach': toast('In the live tool, attach a handbook, ordinance or charter for the assistant to review.'); break;
    case 'upload-handbook': if(!state.busy){ t.disabled=true; ask('Here\'s our current personnel policy.', {file:'Personnel Policy 2019.docx', answer:A.review()}); } break;
    case 'pdf': toast('PDF export is part of the live build.'); break;
    case 'copy': { const txt = t.closest('.ai-body').innerText.trim(); (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Answer copied.'),()=>toast('Copy isn\'t available in this view.')); break; }
    case 'vote': { const sibs=t.parentNode.querySelectorAll('[data-action="vote"]'); sibs.forEach(s=>{s.classList.remove('on');s.setAttribute('aria-pressed','false');}); t.classList.add('on'); t.setAttribute('aria-pressed','true'); toast('Thanks — feedback like this helps OMAG improve answers.'); break; }
  }
});
$('#scrim').addEventListener('click', closePanel);
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if($('#modal').classList.contains('show')) closeModal(); else if($('#panel').classList.contains('show')) closePanel(); else closeSidebar(); } });

/* ============ INIT ============ */
document.querySelectorAll('[data-bot-name]').forEach(el=>el.textContent=BOT);
document.title = `${BOT} – OMAG's HR Assistant (Prototype)`;
renderProfile();
renderWelcome();
})();
</script>
